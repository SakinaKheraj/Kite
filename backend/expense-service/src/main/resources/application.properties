spring.application.name=expenseService
server.port=${PORT:9820}

# --- Kafka Ingestion Infrastructure ---
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.consumer.group-id=expense-info-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.expense.service.consumer.ExpenseDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic-json.name=${KAFKA_TOPIC:expense_service}
spring.kafka.consumer.properties.spring.json.type.mapping=com.expense.service.dto.ExpenseDto
spring.kafka.consumer.auto-offset-reset=earliest

# --- Relational Storage Connection (Persistent File-Backed H2 / MySQL) ---
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/expensedb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true

# --- ORM Layer Architecture (Hibernate) ---
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true