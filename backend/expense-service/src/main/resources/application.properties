spring.application.name=expenseService
server.port=${SERVER_PORT:9820}

# --- Kafka Ingestion Infrastructure ---
# Default fallback to localhost:9092 for local dev; overridden by Docker Compose to kafka:9092
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.consumer.group-id=expense-info-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.expense.service.consumer.ExpenseDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic-json.name=${KAFKA_TOPIC:expense_service}
spring.kafka.consumer.properties.spring.json.type.mapping=com.expense.service.dto.ExpenseDto
spring.kafka.consumer.auto-offset-reset=earliest

# --- Relational Storage Connection (MySQL) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Default fallback to localhost:3306; overridden by Docker Compose to mysql-8.3.0:3306
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:expenseservice}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

# Database Credentials
spring.datasource.username=${MYSQL_USER:microservice}
spring.datasource.password=${MYSQL_PASSWORD:Microservice@123}

# --- ORM Layer Architecture (Hibernate) ---
# Explicitly set Hibernate Dialect to prevent metadata lookup failures
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true