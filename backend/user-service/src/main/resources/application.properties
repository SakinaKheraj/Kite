spring.application.name=userservice
server.port=${PORT:9899}

# --- Kafka Consumer Infrastructure ---
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-service-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.example.userservice.deserializer.UserInfoDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic.name=${KAFKA_TOPIC:user-created-topic}

# --- Relational Storage Connection (Persistent File-Backed H2 / MySQL) ---
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/userdb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true

# --- JPA / ORM Layer ---
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.com.example.userservice=DEBUG