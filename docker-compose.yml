version: '3'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Fixed EXTERNAL port to 9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://192.168.56.101:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9094:9094"

  mysql:
    image: mysql:8.3.0
    container_name: mysql-8.3.0
    restart: always
    environment:
      MYSQL_DATABASE: authservice
      MYSQL_USER: microservice
      MYSQL_PASSWORD: Microservice@123
      MYSQL_ROOT_PASSWORD: "#Sakina22"
    ports:
      - "3306:3306"
    volumes:
      - mysql-db:/var/lib/mysql

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    image: auth-service
    container_name: auth-service
    depends_on:
      - kafka
      - mysql
    ports:
      - "9898:9898"
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - MYSQL_HOST=mysql-8.3.0
      - MYSQL_PORT=3306
      - MYSQL_DB=authservice
      - MYSQL_USER=root
      - MYSQL_PASSWORD=#Sakina22

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    image: user-service
    container_name: user-service
    depends_on:
      - kafka
      - mysql
    ports:
      - "9899:9899"
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - MYSQL_HOST=mysql-8.3.0
      - MYSQL_PORT=3306
      - MYSQL_DB=userservice
      - MYSQL_USER=root
      - MYSQL_PASSWORD=#Sakina22

  expense-service:
    build:
      context: .
      dockerfile: backend/expense-service/Dockerfile
    image: expense-service
    container_name: expense-service
    depends_on:
      - kafka
      - mysql
    ports:
      - "9820:9820"
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - MYSQL_HOST=mysql-8.3.0
      - MYSQL_PORT=3306
      - MYSQL_DB=expenseservice
      - MYSQL_USER=root
      - MYSQL_PASSWORD=#Sakina22

  ds-service:
    build:
      context: ./backend/ds-service
      dockerfile: Dockerfile
    image: ds-service
    container_name: ds-service
    depends_on:
      - kafka
      - mysql
      - expense-service
      - user-service
    ports:
      - "8010:8010"
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-aR86S1G0ZPiSaC1ykkyVJ8pkWAW2c1Le}

volumes:
  mysql-db:
    driver: local
