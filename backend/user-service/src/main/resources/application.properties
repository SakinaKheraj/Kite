spring.application.name=userservice
server.port=${SERVER_PORT:9899}

# --- Kafka Consumer Infrastructure ---
# Default fallback to localhost:9092; overridden by Docker Compose to kafka:9092
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:user-service-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.example.userservice.deserializer.UserInfoDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.topic.name=${KAFKA_TOPIC:user-created-topic}

# --- Relational Storage Connection (MySQL) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Default fallback to localhost:3306; overridden by Docker Compose to mysql:3306 (or mysql-8.3.0:3306)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:userservice}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:#Sakina22}

# --- JPA / ORM Layer ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.com.example.userservice=DEBUG